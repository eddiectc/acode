name: CI

# The coding standard's §8 gates: one Linux job, no OS matrix, -count=1, and
# govulncheck. The commands live in the Makefile so a local `make dod` and CI
# run the same thing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the check tools; do not float to latest in a gate.
  GOIMPORTS_VERSION: v0.52.0
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  dod:
    name: make dod
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install check tools
        run: |
          set -eu
          go install "golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          printf '%s/bin\n' "$(go env GOPATH)" >> "${GITHUB_PATH}"

      # -race needs cgo, so the job must have a C toolchain.
      - name: Ensure a C toolchain for -race
        run: |
          set -eu
          if ! command -v gcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc libc6-dev
          fi
          gcc --version

      - name: Verify module files
        run: |
          set -eu
          go mod tidy
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Run the automated definition of done
        run: make dod
