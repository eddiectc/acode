name: Image

# Publish ghcr.io/<owner>/<repo>:
#   - latest on every commit to main
#   - the semver tags for a vX.Y.Z tag
#   - a short-sha tag on every published build
# A pull request builds linux/amd64 only and publishes nothing.
#
# This job gates on the image compiling, not on the test suite: make dod in
# ci.yml is the test gate. Tag a release after CI is green.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # A tag push reports its tag; a branch build reports a devel revision so
      # `acode -version` never claims to be a release it is not.
      - name: Resolve the stamped version
        id: version
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf 'value=%s\n' "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            printf 'value=devel-%s\n' "$(git rev-parse --short=7 HEAD)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
