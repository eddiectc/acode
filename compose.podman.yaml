# Rootless Podman override for compose.yaml: keep-id maps the caller onto the
# image user, and in_pod: false gives each service its own namespaces instead
# of podman-compose's shared pod, which refuses per-container userns and
# network requests. Do not merge this into Docker or rootful Podman; Docker
# users set ACODE_UID and ACODE_GID in .env instead.
# See docs/container.md section 4.

x-podman:
  in_pod: false

services:
  acode:
    userns_mode: "keep-id:uid=1000,gid=1000"
