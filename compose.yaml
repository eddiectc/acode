# acode's local stack: the agent, a LiteLLM gateway, SearXNG for web_search,
# and Crawl4AI for web_fetch. Run it with scripts/acode-docker or
# scripts/acode-podman from the project to edit; see docs/container.md.

name: acode-stack

services:
  acode:
    # The stack image: a Go toolchain, the released binary, and gh, so `go build`,
    # `go test`, and a push work on the workspace (docs/container.md section 6).
    # Another language copies compose/Dockerfile and points `dockerfile:` at it.
    build:
      context: .
      dockerfile: compose/Dockerfile
      args:
        ACODE_IMAGE: ${ACODE_IMAGE:-ghcr.io/eddiectc/acode:latest}
        UID: ${ACODE_UID:-1000}
        GID: ${ACODE_GID:-1000}
    image: localhost/acode-stack:local
    # `run` makes a one-off container, so instances share this definition.
    init: true
    stdin_open: true
    tty: true
    # $PWD, mounted at the same absolute path: resume and the recorded
    # workspace rely on it (docs/container.md section 3).
    working_dir: ${ACODE_WORKSPACE:-${PWD:?run from the directory to edit, or set ACODE_WORKSPACE}}
    # The three services publish on 127.0.0.1, and a network-namespace join
    # cannot work with keep-id (docs/container.md section 5).
    network_mode: host
    depends_on:
      - searxng
      - litellm
      - crawl4ai
    environment:
      # A models.dev catalog ID that the upstream also accepts by name.
      ACODE_MODEL: ${ACODE_MODEL:-deepseek-v4.1-flash}
      ACODE_PROVIDER_BASE_URL: http://127.0.0.1:${LITELLM_PORT:-4000}/go-native/v1
      ACODE_PROVIDER_TOKEN: ${LITELLM_MASTER_KEY:-sk-acode-local}
      ACODE_SEARXNG_URL: http://127.0.0.1:${SEARXNG_PORT:-8889}
      ACODE_WEB_FETCH_PROVIDER: crawl4ai
      ACODE_WEB_FETCH_URL: http://127.0.0.1:${CRAWL4AI_PORT:-11235}
      ACODE_WEB_FETCH_KEY: ${CRAWL4AI_API_TOKEN:-acode-local-crawl4ai}
      TERM: ${TERM:-xterm-256color}
    volumes:
      # Same path on both sides; `Z` relabels for SELinux, and is ignored off it.
      - type: bind
        source: ${ACODE_WORKSPACE:-${PWD:?run from the directory to edit, or set ACODE_WORKSPACE}}
        target: ${ACODE_WORKSPACE:-${PWD:?run from the directory to edit, or set ACODE_WORKSPACE}}
        bind:
          selinux: Z
      - acode-state:/home/acode/.acode
      - go-mod-cache:/home/acode/go/pkg/mod
      - go-build-cache:/home/acode/.cache/go-build
      # Always on, and read-only. A machine with none of these still runs: the
      # launchers create an empty directory or file first, so gh reports no
      # login and ssh finds no key instead of the engine leaving root-owned
      # paths behind (docs/container.md section 5). The gh target is fixed
      # because a tool call gets HOME but neither GH_CONFIG_DIR nor
      # XDG_CONFIG_HOME; known_hosts sits beside the key at the path ssh reads.
      - type: bind
        source: ${HOME:?HOME is not set}/.config/acode/gh
        target: /home/acode/.config/gh
        read_only: true
        bind:
          selinux: Z
      - type: bind
        source: ${HOME:?HOME is not set}/.config/acode/gitconfig
        target: /home/acode/.gitconfig
        read_only: true
        bind:
          selinux: Z
      - type: bind
        source: ${HOME:?HOME is not set}/.config/acode/.ssh
        target: /home/acode/.ssh
        read_only: true
        bind:
          selinux: Z

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    # The port is on the command line so one value visibly drives the listener.
    command: ["--config", "/etc/litellm/config.yaml", "--host", "0.0.0.0", "--port", "${LITELLM_PORT:-4000}"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-acode-local}
      # Only this service sees the real provider key.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:${LITELLM_PORT:-4000}"
    volumes:
      # ACODE_STACK_DIR keeps the bind correct when podman-compose runs
      # elsewhere; it resolves relative sources from the working directory.
      - type: bind
        source: ${ACODE_STACK_DIR:-.}/compose/litellm
        target: /etc/litellm
        read_only: true
        bind:
          selinux: Z
    networks:
      - stack
    healthcheck:
      # A python image, so no curl or wget is assumed.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${LITELLM_PORT:-4000}/health/liveliness', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      # The entrypoint copies SEARXNG_PORT into GRANIAN_PORT, so this value
      # moves the listener, the publish, and acode's URL together. 8889 rather
      # than 8080 because 8080 is the usual dev-server port.
      SEARXNG_PORT: ${SEARXNG_PORT:-8889}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:${SEARXNG_PORT:-8889}/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-acode-local-searxng}
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      # The settings mount is read-only, so the entrypoint logs an ownership
      # warning instead of chowning it; keep the mount read-only.
      FORCE_OWNERSHIP: "false"
    ports:
      # Loopback only: this is the operator's browser, not a public instance.
      - "127.0.0.1:${SEARXNG_PORT:-8889}:${SEARXNG_PORT:-8889}"
    volumes:
      # settings.yml enables the json format web_search asks for.
      - type: bind
        source: ${ACODE_STACK_DIR:-.}/compose/searxng
        target: /etc/searxng
        read_only: true
        bind:
          selinux: Z
      - searxng-cache:/var/cache/searxng
    networks:
      - stack
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${SEARXNG_PORT:-8889}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  crawl4ai:
    image: docker.io/unclecode/crawl4ai:latest
    restart: unless-stopped
    # Chromium needs shared memory; the default 64 MiB crashes renderers.
    shm_size: "1gb"
    environment:
      # acode sends this as its bearer token, and without one the entrypoint
      # binds only the container's loopback and the publish stops working.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-acode-local-crawl4ai}
      # The entrypoint copies CRAWL4AI_PORT into GUNICORN_BIND.
      CRAWL4AI_PORT: ${CRAWL4AI_PORT:-11235}
    ports:
      - "127.0.0.1:${CRAWL4AI_PORT:-11235}:${CRAWL4AI_PORT:-11235}"
    networks:
      - stack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${CRAWL4AI_PORT:-11235}/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  stack:

volumes:
  acode-state:
  go-mod-cache:
  go-build-cache:
  searxng-cache:
