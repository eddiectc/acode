# Pass-through gateway for the acode stack: a credential holder that keeps the
# real provider key out of the agent container. It attaches the upstream key
# and forwards path and body untouched, so ACODE_MODEL must be a name the
# upstream accepts as well as a models.dev catalog ID. No model_list, routing,
# or budget. See docs/container.md section 5.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  pass_through_endpoints:
    - path: "/go-native"
      # Everything after /go-native is appended to this literal URL, which is
      # the upstream base before /v1. os.environ/ is expanded in headers only.
      target: "https://opencode.ai/zen/go"
      include_subpath: true
      forward_headers: true
      # Explicit: for these entries the model default does not apply, and with
      # it set the route requires the master key.
      auth: true
      headers:
        Authorization: "Bearer os.environ/OPENCODE_API_KEY"
