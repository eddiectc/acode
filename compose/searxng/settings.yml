# Research-weighted SearXNG for the acode stack. `use_default_settings` merges
# this over the image defaults, so an `engines` entry whose `name` matches a
# built-in updates that engine instead of adding a second one. There is no
# server.secret_key here: set SEARXNG_SECRET, or SearXNG rejects the file.
# See docs/container.md section 1.

use_default_settings: true

search:
  # json is the one format acode cannot work without.
  formats:
    - html
    - json
  safe_search: 0

outgoing:
  # Per-engine upstream timeout, kept under the tool's 15 s call budget.
  request_timeout: 10.0

plugins:
  # An entry takes exactly one field, `active`; the hostnames settings below
  # are top level because that is where the plugin reads them.
  searx.plugins.hostnames.SXNGPlugin:
    active: true

  # Routes DOI links to open copies where one exists.
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: true

hostnames:
  # Regexes matched against the result host, not globs: `*.arxiv.org` raises
  # re.error in the plugin's init and kills the container.
  high_priority:
    - '(.*\.)?arxiv\.org$'
    - '(.*\.)?biorxiv\.org$'
    - '(.*\.)?medrxiv\.org$'
    - '(.*\.)?openreview\.net$'
    - '(.*\.)?core\.ac\.uk$'
    - '(.*\.)?base-search\.net$'
    - '(.*\.)?semanticscholar\.org$'
    - '(.*\.)?paperswithcode\.com$'
    - '(.*\.)?github\.com$'
  low_priority:
    - '(.*\.)?medium\.com$'
    - '(.*\.)?quora\.com$'
    - '(.*\.)?pinterest\.com$'

# `weight` scales an engine's contribution to the merged ranking, and `name`
# must match the built-in name or a second engine with that module is appended.
engines:
  - name: arxiv
    engine: arxiv
    shortcut: ar
    categories: [science, general]
    weight: 2.5
    disabled: false

  # Google Scholar bans datacenter IPs; a ban is reported as an unresponsive
  # engine while the others still answer.
  - name: google scholar
    engine: google_scholar
    shortcut: gs
    categories: [science, general]
    weight: 2.0
    disabled: false

  - name: semantic scholar
    engine: semantic_scholar
    shortcut: se
    categories: [science, general]
    weight: 2.0
    disabled: false

  # Needs a free API key: https://core.ac.uk/services/api
  - name: core.ac.uk
    engine: core
    shortcut: cr
    categories: [science, general]
    weight: 1.8
    api_key: ""
    disabled: true

  - name: base
    engine: base
    shortcut: ba
    categories: [science, general]
    weight: 1.8
    disabled: false

  - name: pubmed
    engine: pubmed
    shortcut: pm
    categories: [science]
    weight: 1.5
    disabled: false

  - name: github
    engine: github
    shortcut: gh
    categories: [science, it, general]
    weight: 1.2
    disabled: false

  - name: hackernews
    engine: hackernews
    shortcut: hn
    categories: [it, general, news]
    weight: 2.5
    disabled: false
